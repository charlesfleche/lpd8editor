name: Test

# A push to master, and every pull request. Not every branch push: a branch
# with a pull request would otherwise run everything twice (once for the
# push, once for the pull request, in different concurrency groups). Other
# branches can be tested by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository. A job that needs
# more says so itself.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going for the
# previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trixie:
    name: Debian trixie / ${{ matrix.compiler }}
    runs-on: ubuntu-26.04
    # Debian trixie sets the oldest versions we support (GCC 14, Clang 19,
    # Qt 6.8), so it runs in its own container rather than on the runner's
    # Ubuntu.
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      # git must be in the container before the checkout, otherwise
      # actions/checkout downloads a tarball without the history.
      - name: Install git
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates git

      - name: Checkout
        # Actions are pinned to a commit SHA: a tag can be moved to other
        # code, a SHA cannot. Dependabot keeps them up to date.
        # persist-credentials: false, in every workflow: by default the
        # checkout leaves the job's token in .git/config, where every later
        # step (and any build script) can read it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: tools/ci/install-dependencies.sh

      # Release presets: some warnings only show up with optimizations on.
      - name: Configure
        run: cmake --preset ${{ matrix.compiler }}-release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DLPD8EDITOR_REQUIRE_VALIDATORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.compiler }}-release

      - name: Test
        run: ctest --preset ${{ matrix.compiler }}-release

  ubuntu:
    name: Ubuntu 26.04 / ${{ matrix.compiler }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: tools/ci/install-dependencies.sh

      - name: Configure
        run: cmake --preset ${{ matrix.compiler }}-release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DLPD8EDITOR_REQUIRE_VALIDATORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.compiler }}-release

      # The runner can load the sequencer module, unlike the trixie
      # container, so the ALSA tests (alsaseqtransport_test, among them
      # those of what another local client can do to lpd8editor) run here,
      # and must not skip.
      - name: Enable the ALSA sequencer
        run: tools/ci/enable-alsa-sequencer.sh

      - name: Test
        env:
          LPD8EDITOR_REQUIRE_ALSA: 1
        run: ctest --preset ${{ matrix.compiler }}-release

      - name: Install
        run: cmake --install build/${{ matrix.compiler }}-release --prefix "$RUNNER_TEMP/lpd8editor"
