name: Test

on:
  push:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Dependencies
        run: sudo apt install
          libasound2-dev
          qt6-svg-dev
          qt6-base-dev
          qt6-tools-dev

      - name: Code
        uses: actions/checkout@v6

      - name: Configure
        run: cmake . -DCMAKE_INSTALL_PREFIX=/tmp/lpd8editor -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build .

      - name: Test
        run: cmake --build . --target test

      - name: Install
        run: cmake --build . --target install

